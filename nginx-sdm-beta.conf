# ==============================================================================
# KONFIGURASI NGINX VIRTUAL HOST - VERSI BETA / PRODUCTION
# SIM SDM PDM KOTA YOGYAKARTA
#
# Lokasi di server: /etc/nginx/sites-available/sdm-pdm-kota.conf
# Tautkan symlink:  sudo ln -s /etc/nginx/sites-available/sdm-pdm-kota.conf /etc/nginx/sites-enabled/
# Uji konfigurasi:  sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sdm.pdmkotayogya.or.id beta-sdm.pdmkotayogya.or.id;

    # Pengalihan otomatis HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sdm.pdmkotayogya.or.id beta-sdm.pdmkotayogya.or.id;

    # Direktori root publik Laravel
    root /var/www/sdm-pdm-kota/public;
    index index.php index.html;

    # Sertifikat SSL (Let's Encrypt Certbot)
    # ssl_certificate /etc/letsencrypt/live/sdm.pdmkotayogya.or.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sdm.pdmkotayogya.or.id/privkey.pem;

    # Batas ukuran upload dokumen & foto pegawai (25MB)
    client_max_body_size 25M;

    # Header Keamanan
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Kompresi Gzip untuk Kecepatan Loading Aplikasi
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Penanganan Script PHP melalui PHP-FPM (Sesuaikan versi PHP yang terpasang, e.g. php8.2-fpm atau php8.3-fpm)
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
    }

    # Caching Aset Statis Frontend (Vite Assets, Font, Gambar)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proteksi: Larang Akses Langsung ke File Tersembunyi (.env, .git, .sqlite)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(sqlite|sqlite3|db)$ {
        deny all;
    }

    access_log /var/log/nginx/sdm-access.log;
    error_log /var/log/nginx/sdm-error.log;
}

